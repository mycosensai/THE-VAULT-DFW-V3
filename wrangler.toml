name = "thevault"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# D1 Database Binding - create with: npx wrangler d1 create thevault-db
[[d1_databases]]
binding = "DB"
database_name = "thevault-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets to set via wrangler:
# wrangler pages secret put APP_SECRET
# wrangler pages secret put STRIPE_SECRET_KEY
# wrangler pages secret put VITE_STRIPE_PUBLISHABLE_KEY
# wrangler pages secret put COINBASE_API_KEY
# wrangler pages secret put OPENAI_API_KEY
# wrangler pages secret put GOOGLE_CLIENT_ID
# wrangler pages secret put GOOGLE_CLIENT_SECRET
# wrangler pages secret put X_CLIENT_ID
# wrangler pages secret put X_CLIENT_SECRET
