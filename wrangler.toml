name = "thevault-db"
compatibility_date = "2025-04-01"
compatibility_flags = []
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

# Cloudflare D1 database binding
# Database name: thevault-db
[[d1_databases]]
binding = "DB"
database_name = "thevault"
database_id = "375949ce-7c7d-4822-8235-461446769258"

# Required production secrets:
# wrangler pages secret put APP_SECRET
# wrangler pages secret put STRIPE_SECRET_KEY
# wrangler pages secret put STRIPE_WEBHOOK_SECRET
# wrangler pages secret put VITE_STRIPE_PUBLISHABLE_KEY
# wrangler pages secret put VAULT_DOMAIN

# Optional OAuth/email secrets:
# wrangler pages secret put GOOGLE_CLIENT_ID
# wrangler pages secret put GOOGLE_CLIENT_SECRET
# wrangler pages secret put X_CLIENT_ID
# wrangler pages secret put X_CLIENT_SECRET
# wrangler pages secret put GITHUB_CLIENT_ID
# wrangler pages secret put GITHUB_CLIENT_SECRET
# wrangler pages secret put RESEND_API_KEY
