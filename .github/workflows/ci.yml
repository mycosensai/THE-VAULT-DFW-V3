name: CI Build Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, stabilize/auth-tree-audit]

jobs:
  build-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true
